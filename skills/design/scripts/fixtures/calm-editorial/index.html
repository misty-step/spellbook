<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release 0.6 · What changed</title>
  <link rel="stylesheet" href="editorial.css">
</head>
<body>
  <main class="column">
    <header>
      <h1>Release 0.6</h1>
      <p class="lede">Checkout settles in one step. Failed cards say what to do next.</p>
    </header>
    <figure>
      <img src="checkout-before-after.png" width="1440" height="900" alt="Checkout before and after: three screens become one">
    </figure>
    <section aria-labelledby="numbers">
      <h2 id="numbers">Numbers</h2>
      <table>
        <thead><tr><th scope="col">Measure</th><th scope="col">Before</th><th scope="col">After</th></tr></thead>
        <tbody>
          <tr><td>Median checkout</td><td>41&nbsp;s</td><td>18&nbsp;s</td></tr>
          <tr><td>Abandoned carts</td><td>12%</td><td>7%</td></tr>
        </tbody>
      </table>
    </section>
    <blockquote>
      <p>I paid before I noticed I had started.</p>
    </blockquote>
    <form class="actions">
      <button type="submit" class="button">Publish notes</button>
      <button type="button" class="button button-quiet" disabled>Archive</button>
    </form>
  </main>
</body>
</html>
