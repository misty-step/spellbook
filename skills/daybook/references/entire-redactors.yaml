# Entire rule pack (layer 6): Misty Step token shapes, redact-and-continue.
# Regexes are Go RE2. Every match is replaced with REDACTED.
# Sample values are fake: FAKE/CANARY markers and repeated characters only.
# No \b anchors: in jsonl a token often follows a literal "\n" escape.
name: misty-tokens
version: 1
rules:
  - id: github-token
    # classic PAT, OAuth, user-to-server, server-to-server, refresh
    regex: '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}'
  - id: github-fine-grained
    regex: 'github_pat_[A-Za-z0-9_]{22,}'
  - id: openrouter-key
    regex: 'sk-or-v1-[0-9a-fA-F]{64}'
  - id: anthropic-key
    # sk-ant-api03-, sk-ant-admin01-, sk-ant-oat01-, ...
    regex: 'sk-ant-[A-Za-z0-9_-]{20,}'
  - id: openai-project-key
    regex: 'sk-(proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'
  - id: openai-key
    # legacy sk-<48 alnum>; hyphenated sk-ant-/sk-or-/sk-proj- never match
    regex: 'sk-[A-Za-z0-9]{32,}'
  - id: tailscale-key
    regex: 'tskey-(auth|api)-[A-Za-z0-9_-]{10,}'
  - id: bearer-auth-header
    # also matches the escaped-JSON form \"Authorization\": \"Bearer ...\"
    regex: '(?i)authorization[\\"'']{0,3}\s*[:=]\s*[\\"'']{0,3}bearer\s+[A-Za-z0-9._~+/=-]{8,}'
  - id: bearer-token
    regex: '(?i)bearer\s+[A-Za-z0-9._~+/=-]{20,}'
  - id: private-key
    # header through the first END line when present, else the header alone
    regex: '-----BEGIN[A-Z0-9 ]* PRIVATE KEY( BLOCK)?-----(?:[\s\S]*?-----END[A-Z0-9 ]* PRIVATE KEY( BLOCK)?-----)?'
